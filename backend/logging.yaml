version: 1
disable_existing_loggers: false

formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    format: "%(levelname)-8s [%(asctime)s] %(message)s"
    datefmt: "%d-%m-%Y %H:%M:%S"
  standard:
    format: "%(levelname)-8s [%(asctime)s] %(message)s"
    datefmt: "%d-%m-%Y %H:%M:%S"

handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

loggers:
  uvicorn:
    level: INFO
    handlers: [default]
    propagate: no
    error:
      propagate: true
  uvicorn.error:
    level: INFO

root:
  level: INFO
  handlers: [console]
  propagate: no
